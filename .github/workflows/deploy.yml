name: Déploiement du site

# Chaque push sur la branche publiée regénère version.json : les onglets déjà
# ouverts détectent le nouvel identifiant et se rechargent tout seuls.
on:
  push:
    branches:
      - main
      - master
      - claude/f1-project-auto-refresh-pvy2bd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Estampiller la version (identifiant du commit)
        run: |
          set -euo pipefail
          BUILD="${GITHUB_SHA::12}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s|<meta name=\"build-id\" content=\"__BUILD_ID__\">|<meta name=\"build-id\" content=\"${BUILD}\">|" index.html
          printf '{"build":"%s","builtAt":"%s"}\n' "$BUILD" "$BUILT_AT" > version.json
          grep -q "content=\"${BUILD}\"" index.html || { echo "L'identifiant n'a pas été injecté dans index.html"; exit 1; }
          cat version.json

      # enablement: active GitHub Pages sur le dépôt au premier déploiement,
      # sans passer par Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
