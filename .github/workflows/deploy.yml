name: Déploiement du site

# Prérequis, une seule fois : Settings → Pages → Build and deployment →
# Source : GitHub Actions. Sans cela le job échoue sur « Get Pages site failed ».
#
# Ensuite, chaque push regénère version.json : les onglets déjà ouverts
# détectent le nouvel identifiant et se rechargent tout seuls.
on:
  push:
    branches:
      - main
      - master
      - claude/f1-project-auto-refresh-pvy2bd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # On assemble _site plutôt que de publier le dépôt tel quel : seuls les
      # fichiers du site sont mis en ligne, ni .git ni le workflow.
      - name: Préparer le site et estampiller la version
        run: |
          set -euo pipefail
          BUILD="${GITHUB_SHA::12}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p _site
          sed "s|<meta name=\"build-id\" content=\"__BUILD_ID__\">|<meta name=\"build-id\" content=\"${BUILD}\">|" index.html > _site/index.html
          sed "s|__BUILD_ID__|${BUILD}|g" sw.js > _site/sw.js
          cp manifest.webmanifest icone-180.png icone-192.png icone-512.png icone-maskable-512.png apercu-partage.jpg _site/
          # Le coffre n'est publie qu'une fois chiffre : sans lui, la page du
          # contrat reste a terre plutot que de faire echouer tout le deploiement.
          if [ -f contrat.coffre ]; then cp contrat.html contrat.coffre _site/; fi
          printf '{"build":"%s","builtAt":"%s"}\n' "$BUILD" "$BUILT_AT" > _site/version.json
          cp .nojekyll _site/.nojekyll
          grep -q "content=\"${BUILD}\"" _site/index.html || { echo "L'identifiant de version n'a pas été injecté dans index.html"; exit 1; }
          grep -q "stavelot-${BUILD}" _site/sw.js || { echo "Le service worker n'a pas été estampillé"; exit 1; }
          grep -q 'og:image" content="https://' _site/index.html || { echo "L'aperçu de partage doit pointer une adresse absolue"; exit 1; }
          if [ -f _site/contrat.coffre ]; then
            head -c 8 _site/contrat.coffre | grep -q STAVCOF1 || { echo "contrat.coffre n'est pas un coffre chiffré"; exit 1; }
          else
            echo "::notice::contrat.coffre absent — l'espace propriétaire n'est pas publié"
          fi
          find _site -iname '*.docx' -o -iname '*.pdf' | grep -q . && { echo "Un document en clair s'est glissé dans le site"; exit 1; } || true
          cat _site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
