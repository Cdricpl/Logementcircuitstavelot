name: Déploiement du site

# Prérequis, une seule fois : Settings → Pages → Build and deployment →
# Source : GitHub Actions. Sans cela le job échoue sur « Get Pages site failed ».
#
# Ensuite, chaque push regénère version.json : les onglets déjà ouverts
# détectent le nouvel identifiant et se rechargent tout seuls.
on:
  push:
    branches:
      - main
      - master
      - claude/f1-project-auto-refresh-pvy2bd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # On assemble _site plutôt que de publier le dépôt tel quel : seuls les
      # fichiers du site sont mis en ligne, ni .git ni le workflow.
      - name: Préparer le site et estampiller la version
        run: |
          set -euo pipefail
          BUILD="${GITHUB_SHA::12}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p _site
          sed "s|<meta name=\"build-id\" content=\"__BUILD_ID__\">|<meta name=\"build-id\" content=\"${BUILD}\">|" index.html > _site/index.html
          printf '{"build":"%s","builtAt":"%s"}\n' "$BUILD" "$BUILT_AT" > _site/version.json
          cp .nojekyll _site/.nojekyll
          grep -q "content=\"${BUILD}\"" _site/index.html || { echo "L'identifiant de version n'a pas été injecté dans index.html"; exit 1; }
          cat _site/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
